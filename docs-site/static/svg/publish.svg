<svg viewBox="0 0 980 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Публикация партиции">
  <defs><marker id="ah-pub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0L10,5L0,10z"/></marker></defs>
  <rect x="10" y="20" width="220" height="56" rx="10" class="box fld ld"/><text x="24" y="44" font-weight="650">Текущая партиция</text><text x="24" y="63" class="t3">− старые строки изменившихся документов</text>
  <rect x="10" y="96" width="220" height="56" rx="10" class="box ftr tr"/><text x="24" y="120" font-weight="650">Свежие строки</text><text x="24" y="139" class="t3">извлечены из 1С, id назначены</text>
  <path class="edge" d="M230,48 H262 V86 H288" marker-end="url(#ah-pub)"/><path class="edge" d="M230,124 H262 V86"/>
  <rect x="290" y="58" width="170" height="56" rx="10" class="box fpg pg"/><text x="304" y="82" font-weight="650">_stage</text><text x="304" y="101" class="t3 mono">собранная партиция</text>
  <path class="edge" d="M460,86 H498" marker-end="url(#ah-pub)"/>
  <rect x="500" y="50" width="200" height="72" rx="10" class="box ftr tr"/><text x="514" y="74" font-weight="650">Сверка</text><text x="514" y="93" class="t3">отпечатки kept + fresh = stage</text><text x="514" y="109" class="t3">дубли ключа = 0, not_zero</text>
  <path class="edge" d="M700,72 H758" marker-end="url(#ah-pub)"/><text x="712" y="64" class="t3 ctext-ok">PASS</text>
  <rect x="760" y="40" width="200" height="56" rx="10" class="box fld ld"/><text x="774" y="64" font-weight="650">REPLACE PARTITION</text><text x="774" y="83" class="t3">атомарно в fact_*</text>
  <path class="edge" d="M700,104 H758" marker-end="url(#ah-pub)"/><text x="712" y="122" class="t3 ctext-bad">FAIL</text>
  <rect x="760" y="104" width="200" height="56" rx="10" class="box fbad bad"/><text x="774" y="128" font-weight="650" class="ctext-bad">не публикуется</text><text x="774" y="147" class="t3">витрина не меняется, повтор окна</text>
  <text x="10" y="200" class="t3">Плохая партиция никогда не попадает в витрину: сбой = «ничего не изменилось», а не «полуготовые данные».</text>
</svg>
