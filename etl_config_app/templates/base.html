<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ETL Config{% endblock %}</title>
    <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
    <style>
        .env-badge{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em}
        .env-badge.test{background:#e8f1ff;color:#1d4ed8;border:1px solid #bfdbfe}
        .env-badge.prod{background:#dc2626;color:#fff;border:1px solid #b91c1c}
        .topbar-env{margin:0 12px 0 auto}
        [data-theme="dark"] .env-badge.test{background:#1e3a8a;color:#dbeafe;border-color:#1e40af}
    </style>
    <script>
        // Apply theme before paint — избегаем мигания
        (function() {
            var t = localStorage.getItem('ds-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">&#9670;</div>
            <div>
                <h1>DataPipe</h1>
                <small>Конфигуратор ETL</small>
                <div class="env-badge {{ 'prod' if IS_PROD else 'test' }}" title="База etl_meta/витрины: {{ DB_NAME }}">{{ ENV_LABEL }}</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">Пайплайн</div>
            <a href="/registers" class="{% if active_nav == 'registers' %}active{% endif %}">
                <span class="icon">&#9633;</span>
                Витрины
            </a>
        </nav>
        <div class="sidebar-footer">
            v2.0 &middot; DataPipe
        </div>
    </aside>

    <!-- Main content -->
    <div class="main">
        <div class="topbar">
            <ul class="breadcrumb">
                <li><a href="/registers">Главная</a></li>
                {% block breadcrumb %}{% endblock %}
            </ul>
            <span class="env-badge topbar-env {{ 'prod' if IS_PROD else 'test' }}" title="База: {{ DB_NAME }}{% if IS_PROD %} · destructive DDL через UI {{ 'разрешён' if ALLOW_DESTRUCTIVE else 'запрещён' }}{% endif %}">{{ ENV_LABEL }}</span>
            <button class="theme-toggle" type="button" onclick="toggleTheme()" title="Переключить тему">
                <span class="material-symbols-outlined theme-icon-light">light_mode</span>
                <span class="material-symbols-outlined theme-icon-dark">dark_mode</span>
            </button>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        function toggleTheme() {
            var root = document.documentElement;
            var cur = root.getAttribute('data-theme') || 'light';
            var next = cur === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('ds-theme', next);
        }
    </script>

    {% block modals %}{% endblock %}

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
